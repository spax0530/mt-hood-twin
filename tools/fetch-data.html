<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Mt Hood data builder</title>
<style>body{font:15px/1.5 system-ui,sans-serif;max-width:640px;margin:40px auto;padding:0 16px;color:#1c2a3a}pre{background:#f1f4f8;padding:12px;border-radius:8px;white-space:pre-wrap}button{font:inherit;padding:8px 14px}</style>
</head>
<body>
<h1>Mt Hood data builder</h1>
<p>Collects ski runs, lifts and buildings from OpenStreetMap, then measures ground and roof heights from USGS and Oregon DOGAMI lidar. Takes about two minutes and saves <b>mt-hood-osm.json</b>, which goes in <code>public/data/osm.json</code>.</p>
<p><button id="go">Build data file</button> <a id="save" style="display:none">Save file again</a></p>
<pre id="log">Ready.</pre>
<script>
const BB = '45.20,-121.92,45.52,-121.48';
const USGS = 'https://elevation.nationalmap.gov/arcgis/rest/services/3DEPElevation/ImageServer';
const DOGAMI = 'https://gis.dogami.oregon.gov/arcgis/rest/services/lidar/';
const FT = 0.3048;
const log = (t) => (document.getElementById('log').textContent = t);
const r6 = (v) => Math.round(v * 1e6) / 1e6;

async function samples(service, pts, errs) {
  const body = new URLSearchParams({ geometry: JSON.stringify({ points: pts, spatialReference: { wkid: 4326 } }), geometryType: 'esriGeometryMultipoint', returnFirstValueOnly: 'true', f: 'json' });
  for (let k = 0; k < 3; k++) {
    try {
      const j = await (await fetch(service + '/getSamples', { method: 'POST', body })).json();
      if (!j.samples) throw new Error(JSON.stringify(j).slice(0, 200));
      const out = new Array(pts.length).fill(null);
      for (const s of j.samples) { const v = parseFloat(s.value); out[s.locationId] = isFinite(v) ? v : null; }
      return out;
    } catch (e) {
      if (k === 2) { errs.push(String(e)); return new Array(pts.length).fill(null); }
      await new Promise((r) => setTimeout(r, 1500));
    }
  }
}
async function pool(jobs, n, tick) {
  let k = 0, done = 0;
  await Promise.all(Array.from({ length: n }, async () => { while (k < jobs.length) { await jobs[k++](); tick(++done, jobs.length); } }));
}
const inPoly = (x, y, p) => { let c = false; for (let i = 0, j = p.length - 2; i < p.length; j = i, i += 2) { if ((p[i + 1] > y) !== (p[j + 1] > y) && x < (p[j] - p[i]) * (y - p[i + 1]) / (p[j + 1] - p[i + 1]) + p[i]) c = !c; } return c; };
const areaM2 = (p) => { let a = 0; for (let i = 0; i < p.length - 2; i += 2) a += p[i] * p[i + 3] - p[i + 2] * p[i + 1]; return Math.abs(a / 2) * 78200 * 111100; };

async function build() {
  const errs = [];
  log('1/4 Asking OpenStreetMap for runs, lifts and buildings...');
  const q = `[out:json][timeout:90];(way["aerialway"](${BB});node["aerialway"](${BB});way["piste:type"](${BB});relation["piste:type"](${BB});way["building"](${BB});relation["building"](${BB});way["landuse"="winter_sports"](${BB});relation["landuse"="winter_sports"](${BB});way["amenity"="parking"](${BB}););out body geom;`;
  let E = null, lastErr = '';
  const MIRRORS = ['https://overpass.openstreetmap.fr/api/interpreter', 'https://overpass-api.de/api/interpreter', 'https://overpass.private.coffee/api/interpreter', 'https://overpass.kumi.systems/api/interpreter', 'https://maps.mail.ru/osm/tools/overpass/api/interpreter'];
  for (let k = 0; k < 8 && !E; k++) {
    const u = MIRRORS[k % MIRRORS.length];
    try {
      const r = await fetch(u, { method: 'POST', body: 'data=' + encodeURIComponent(q) });
      if (!r.ok) throw new Error(r.status + ' from ' + new URL(u).host);
      E = (await r.json()).elements;
    } catch (e) { lastErr = String(e); log('1/4 OpenStreetMap server busy (' + lastErr + '), trying another...'); await new Promise((r) => setTimeout(r, 4000)); }
  }
  if (!E) throw new Error('OpenStreetMap servers unavailable: ' + lastErr);
  const flat = (g) => { const o = []; for (const p of g) o.push(r6(p.lon), r6(p.lat)); return o; };
  const D = { fetched: new Date().toISOString(), source: 'OpenStreetMap via Overpass API (ODbL); heights from USGS 3DEP and Oregon DOGAMI lidar', areas: [], runs: [], lifts: [], stations: [], buildings: [], parking: [] };
  const nodeTag = {};
  for (const e of E) if (e.type === 'node' && e.tags && e.tags.aerialway) { nodeTag[e.id] = e.tags; if (e.tags.aerialway === 'station') D.stations.push({ n: e.tags.name || null, lon: r6(e.lon), lat: r6(e.lat) }); }
  const rings = (e) => e.type === 'way' ? [e.geometry] : (e.members || []).filter((m) => m.type === 'way' && m.geometry && m.role !== 'inner').map((m) => m.geometry);
  const KEEP = ['name', 'building', 'building:levels', 'height', 'roof:shape', 'roof:levels', 'amenity', 'tourism', 'shop', 'leisure', 'operator', 'building:material', 'roof:material', 'building:colour', 'roof:colour'];
  for (const e of E) {
    if (e.type === 'node') continue;
    const t = e.tags || {};
    if (t.aerialway) {
      const idx = (kind) => e.nodes.map((id, i) => (nodeTag[id] && nodeTag[id].aerialway === kind ? i : -1)).filter((i) => i >= 0);
      D.lifts.push({ id: e.id, tags: t, p: flat(e.geometry), pyl: idx('pylon'), sta: idx('station') });
    } else if (t['piste:type']) {
      for (const g of rings(e)) {
        const closed = g.length > 3 && g[0].lat === g[g.length - 1].lat && g[0].lon === g[g.length - 1].lon;
        D.runs.push({ n: t['piste:name'] || t.name || null, d: t['piste:difficulty'] || null, t: t['piste:type'], g: t['piste:grooming'] || null, ref: t['piste:ref'] || t.ref || null, a: closed && (t.area === 'yes' || e.type === 'relation') ? 1 : 0, p: flat(g) });
      }
    } else if (t.building) {
      for (const g of rings(e)) { if (g.length < 4) continue; const tags = {}; for (const k of KEEP) if (t[k]) tags[k] = t[k]; D.buildings.push({ id: e.id, tags, p: flat(g) }); }
    } else if (t.landuse === 'winter_sports') { for (const g of rings(e)) D.areas.push({ n: t.name || null, p: flat(g) }); }
    else if (t.amenity === 'parking') { for (const g of rings(e)) if (g.length > 3) D.parking.push({ n: t.name || null, p: flat(g) }); }
  }

  // Building heights above ground (DOGAMI canopy height model, feet)
  const bp = [];
  D.buildings.forEach((b, bi) => {
    const p = b.p; let x0 = 1e9, x1 = -1e9, y0 = 1e9, y1 = -1e9, cx = 0, cy = 0; const n = p.length / 2 - 1;
    for (let i = 0; i < n * 2; i += 2) { x0 = Math.min(x0, p[i]); x1 = Math.max(x1, p[i]); y0 = Math.min(y0, p[i + 1]); y1 = Math.max(y1, p[i + 1]); cx += p[i]; cy += p[i + 1]; }
    cx /= n; cy /= n; b.c = [r6(cx), r6(cy)];
    const wm = (x1 - x0) * 78200, hm = (y1 - y0) * 111100, step = Math.max(2.2, Math.sqrt(wm * hm / 40));
    const nx = Math.max(2, Math.round(wm / step)), ny = Math.max(2, Math.round(hm / step)); let k = 0;
    for (let j = 0; j < ny; j++) for (let i = 0; i < nx; i++) { const x = x0 + (i + 0.5) / nx * (x1 - x0), y = y0 + (j + 0.5) / ny * (y1 - y0); if (inPoly(x, y, p)) { bp.push([bi, x, y]); k++; } }
    if (!k) bp.push([bi, cx, cy]);
  });
  const hs = D.buildings.map(() => []);
  const B = 400, jobs = [];
  for (let i = 0; i < bp.length; i += B) jobs.push(async () => { const ch = bp.slice(i, i + B); const v = await samples(DOGAMI + 'CANOPY_HEIGHT_MODEL_MOSAIC/ImageServer', ch.map((c) => [c[1], c[2]]), errs); ch.forEach((c, k) => { if (v[k] !== null) hs[c[0]].push(v[k] * FT); }); });
  for (let i = 0; i < D.buildings.length; i += B) jobs.push(async () => { const ch = D.buildings.slice(i, i + B); const v = await samples(USGS, ch.map((b) => b.c), errs); ch.forEach((b, k) => { b.g = v[k] === null ? null : Math.round(v[k] * 10) / 10; }); });
  const lp = [];
  D.lifts.forEach((l, li) => { l.e = new Array(l.p.length / 2).fill(null); for (let i = 0; i < l.p.length; i += 2) lp.push([li, i / 2, l.p[i], l.p[i + 1]]); });
  for (let i = 0; i < lp.length; i += B) jobs.push(async () => { const ch = lp.slice(i, i + B); const v = await samples(USGS, ch.map((c) => [c[2], c[3]]), errs); ch.forEach((c, k) => { D.lifts[c[0]].e[c[1]] = v[k] === null ? null : Math.round(v[k] * 10) / 10; }); });
  await pool(jobs, 3, (d, t) => log(`2/4 Measuring building and lift heights: ${d} of ${t}`));
  D.buildings.forEach((b, i) => { const a = hs[i].sort((x, y) => x - y); if (a.length) { const q = (f) => a[Math.min(a.length - 1, Math.floor(f * a.length))]; b.h = [q(0.25), q(0.5), q(0.8), a[a.length - 1]].map((v) => Math.round(v * 10) / 10); } });

  // Roof shapes for large, complex or named buildings (DOGAMI surface model, feet)
  const all = [];
  D.buildings.forEach((b, bi) => {
    const p = b.p; if (!(p.length / 2 - 1 > 8 || areaM2(p) > 300 || b.tags.name)) return;
    let x0 = 1e9, x1 = -1e9, y0 = 1e9, y1 = -1e9;
    for (let i = 0; i < p.length; i += 2) { x0 = Math.min(x0, p[i]); x1 = Math.max(x1, p[i]); y0 = Math.min(y0, p[i + 1]); y1 = Math.max(y1, p[i + 1]); }
    const mlat = 111132, mlon = 111320 * Math.cos(y0 * Math.PI / 180), pad = 2;
    x0 -= pad / mlon; x1 += pad / mlon; y0 -= pad / mlat; y1 += pad / mlat;
    const wm = (x1 - x0) * mlon, hm = (y1 - y0) * mlat; let step = 1.0; while ((wm / step + 1) * (hm / step + 1) > 5000) step *= 1.15;
    const nx = Math.ceil(wm / step) + 1, ny = Math.ceil(hm / step) + 1;
    b.grid = { x0: Math.round(x0 * 1e7) / 1e7, y1: Math.round(y1 * 1e7) / 1e7, dx: step / mlon, dy: step / mlat, nx, ny, step: Math.round(step * 100) / 100, raw: new Array(nx * ny).fill(null) };
    for (let j = 0; j < ny; j++) for (let i = 0; i < nx; i++) all.push([bi, j * nx + i, x0 + i * step / mlon, y1 - j * step / mlat]);
  });
  const jobs2 = [];
  for (let i = 0; i < all.length; i += 800) jobs2.push(async () => { const ch = all.slice(i, i + 800); const v = await samples(DOGAMI + 'DIGITAL_SURFACE_MODEL_MOSAIC/ImageServer', ch.map((c) => [c[2], c[3]]), errs); ch.forEach((c, k) => { D.buildings[c[0]].grid.raw[c[1]] = v[k]; }); });
  await pool(jobs2, 3, (d, t) => log(`3/4 Scanning roof shapes: ${d} of ${t}`));
  for (const b of D.buildings) {
    if (!b.grid) continue; const g = b.grid, vals = g.raw.filter((v) => v !== null);
    if (vals.length < g.raw.length * 0.9) { delete b.grid; continue; }
    const base = Math.min(...vals) * FT; g.base = Math.round(base * 10) / 10;
    g.h = g.raw.map((v) => (v === null ? 0 : Math.round((v * FT - g.base) * 10))); delete g.raw;
    g.dx = +g.dx.toPrecision(8); g.dy = +g.dy.toPrecision(8);
  }
  D.errors = errs.length;
  const blob = new Blob([JSON.stringify(D)], { type: 'application/json' });
  const a = document.getElementById('save'); a.href = URL.createObjectURL(blob); a.download = 'mt-hood-osm.json'; a.style.display = ''; a.click();
  log(`4/4 Done. ${D.runs.length} runs, ${D.lifts.length} lifts, ${D.buildings.length} buildings, ${errs.length} failed requests.\nSaved mt-hood-osm.json (${(blob.size / 1e6).toFixed(1)} MB) to your Downloads folder.`);
  window.__data = D; window.__done = true;
}
document.getElementById('go').onclick = () => build().catch((e) => log('Failed: ' + e));
if (new URLSearchParams(location.search).has('auto')) build().catch((e) => log('Failed: ' + e));
</script>
</body>
</html>
